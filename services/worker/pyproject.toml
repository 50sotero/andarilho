[project]
name = "andarilho-worker"
version = "0.1.0"
description = "Andarilho reconstruction and processing worker"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]==3.3.6",
  "boto3==1.43.113",
  "jsonschema==4.26.0",
  "numpy==2.5.4",
  "mapbox-earcut==2.1.0",
  "pypdf==6.19.0",
  "pillow==12.3.0",
  "httpx==0.28.1",
]

[project.scripts]
andarilho-worker = "andarilho_worker.main:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/andarilho_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# SQL is assembled only from module-level constant fragments; every value is a bound parameter.
"src/andarilho_worker/queue.py" = ["S608"]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "E501", "E741"]
