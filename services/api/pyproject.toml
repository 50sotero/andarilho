[project]
name = "andarilho-api"
version = "0.1.0"
description = "Andarilho control-plane API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pyjwt[crypto]==2.15.1",
  "boto3==1.43.113",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.0",
  "moto[s3,server]",
  "jsonschema==4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/andarilho_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]
